# Cloud Build pipeline for Mediminder.
#
# Trigger: push to branch `branchb`. Substitutions default to the project
# and region we're targeting; override with `--substitutions=_REGION=...`.
#
# Prereqs (out of scope of this repo but documented for the deployer):
#   * Enable APIs: run.googleapis.com, sqladmin.googleapis.com,
#     secretmanager.googleapis.com, artifactregistry.googleapis.com
#   * Create Artifact Registry repo `mediminder` in $_REGION.
#   * Create Cloud SQL instance `mediminder` (Postgres 17), db `mediminder`.
#   * Grant Cloud Build's service account roles: Cloud Run Admin,
#     Secret Manager Secret Accessor, Cloud SQL Client, Service Account User.
#   * The runtime service account for both Cloud Run services must have
#     `roles/secretmanager.secretAccessor` on
#     projects/645869155931/secrets/serviceaccount.

substitutions:
  _REGION: asia-south1
  _REPO: mediminder
  _PROJECT: mediminder-app
  _SQL_INSTANCE: mediminder-app:asia-south1:mediminder

steps:
  # 1. Build backend image.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/backend:${SHORT_SHA}
      - -f
      - backend/Dockerfile
      - backend
  # 2. Build frontend image.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/frontend:${SHORT_SHA}
      - -f
      - frontend/Dockerfile
      - frontend
  # 3. Push both.
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/backend:${SHORT_SHA}"]
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/frontend:${SHORT_SHA}"]
  # 4. Deploy backend.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mediminder-backend
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/backend:${SHORT_SHA}
      - --platform=managed
      - --min-instances=1
      - --max-instances=3
      - --memory=512Mi
      - --port=8000
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-env-vars=ENVIRONMENT=cloud,GCP_PROJECT=645869155931,SECRET_NAME=projects/645869155931/secrets/serviceaccount
      - --allow-unauthenticated
  # 5. Deploy frontend, pointing it at the freshly-deployed backend URL.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(gcloud run services describe mediminder-backend --region=${_REGION} --format='value(status.url)')
        gcloud run deploy mediminder-frontend \
          --region=${_REGION} \
          --image=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/frontend:${SHORT_SHA} \
          --platform=managed \
          --min-instances=0 \
          --max-instances=3 \
          --memory=256Mi \
          --port=3000 \
          --set-env-vars=BACKEND_URL=$${BACKEND_URL},PORT=3000 \
          --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/backend:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/frontend:${SHORT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
